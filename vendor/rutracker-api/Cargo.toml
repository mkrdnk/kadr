[package]
name = "rutracker-api"
version = "0.2.1"
edition = "2024"
description = "Locally hardened subset of published rutracker-api 0.2.1 for kadr desktop"
publish = false
license = "MIT OR Apache-2.0"
authors = ["Evgenii Lepikhin <johnlepikhin@gmail.com>"]
repository = "https://github.com/johnlepikhin/rutracker-api"
readme = "PATCHES.md"
keywords = ["rutracker", "torrent", "tracker", "api", "async"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies"] }
# Already required by reqwest/cookies; use its quiet RFC6265 insertion path.
cookie_store = "0.22.1"
# Privacy policy: parser dependencies otherwise debug-log complete account pages.
# Cargo unifies this ceiling globally for log, not for tracing.
log = { version = "0.4", features = ["max_level_info"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
encoding_rs = "0.8"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[workspace]
