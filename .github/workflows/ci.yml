name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake libssl-dev \
            libfontconfig1-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev \
            libvulkan1 mesa-vulkan-drivers xvfb openbox weston xdotool wmctrl \
            fonts-dejavu-core
      - name: Select full Xcode
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcrun --find metal
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --all-targets
      - name: Native X11 lifecycle smoke
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-x11.py target/debug/kadr-app
      - name: Native Wayland lifecycle in nested Weston
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-wayland.py --binary target/debug/kadr-app --timeout 30
