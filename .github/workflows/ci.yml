name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake libssl-dev \
            libfontconfig1-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev \
            libvulkan1 mesa-vulkan-drivers xvfb openbox weston xdotool wmctrl \
            fonts-dejavu-core imagemagick x11-utils xserver-xorg-core xserver-xorg-video-dummy \
            mpv vlc-bin vlc-plugin-base ffmpeg
      - name: Select full Xcode
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcrun --find metal
      - name: Install macOS test players
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install mpv ffmpeg
          brew install --cask vlc
          mkdir -p "$RUNNER_TEMP/kadr-player-bin"
          ln -s /Applications/VLC.app/Contents/MacOS/VLC "$RUNNER_TEMP/kadr-player-bin/vlc"
          echo "$RUNNER_TEMP/kadr-player-bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --all-targets
      - name: Real HTTP torrent playback and permanent-save acceptance
        run: cargo test --locked -p kadr-app backend::tests::real_ -- --ignored --test-threads=1
      - name: Real mpv and VLC playback
        run: |
          cargo test --locked -p kadr-media --test players_smoke -- --ignored
          cargo test --locked -p kadr-media --test video_smoke -- --ignored
      - name: Native X11 lifecycle smoke
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-x11.py target/debug/kadr-app
      - name: Native Wayland lifecycle in nested Weston
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-wayland.py --binary target/debug/kadr-app --timeout 30
      - name: Rendered native X11 acceptance
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-xorg.py --binary target/debug/kadr-app --artifacts target/smoke-xorg
      - name: Native macOS rendering and lifecycle
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-macos.py --binary target/debug/kadr-app --artifacts target/smoke-macos --screenshot
      - name: Build and open macOS DMG
        if: runner.os == 'macOS'
        env:
          # Local unsigned mount/render QA only; no artifact upload/publication.
          KADR_ALLOW_INCOMPLETE_NOTICES: '1'
        run: |
          scripts/package-dmg.sh --binary target/debug/kadr-app
          set -- target/dist/*.dmg
          test "$#" -eq 1
          mkdir -p "$RUNNER_TEMP/kadr-dmg"
          hdiutil attach -nobrowse -readonly "$1" -mountpoint "$RUNNER_TEMP/kadr-dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/kadr-dmg"' EXIT
          python3 scripts/smoke-macos.py --binary "$RUNNER_TEMP/kadr-dmg/kadr.app/Contents/MacOS/kadr" --artifacts target/smoke-dmg --screenshot
