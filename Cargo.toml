[workspace]
members = [
    "crates/kadr-app",
    "crates/kadr-cache",
    "crates/kadr-catalog",
    "crates/kadr-core",
    "crates/kadr-engine",
    "crates/kadr-media",
    "crates/kadr-storage",
    "crates/kadr-torrent",
    "crates/kadr-ui",
]
resolver = "3"
exclude = ["vendor/gpui", "vendor/rutracker-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui = "=0.2.2"
