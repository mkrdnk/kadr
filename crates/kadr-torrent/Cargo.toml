[package]
name = "kadr-torrent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
bytes = "=1.12.1"
kadr-media = { path = "../kadr-media" }
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "=0.2.186"
