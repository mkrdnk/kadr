[package]
name = "kadr-torrent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
bytes = "=1.12.1"
caseless = "=0.2.2"
kadr-core = { path = "../kadr-core" }
kadr-media = { path = "../kadr-media" }
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls", "disable-upload"] }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "=0.7.20"
unicode-normalization = "=0.1.26"

[dev-dependencies]
sha1 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "=0.2.186"
